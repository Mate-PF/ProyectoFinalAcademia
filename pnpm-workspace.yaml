packages:
  - "domain"
  - "apps/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

# Permite que esbuild (dependencia de vitest) corra su build script.
onlyBuiltDependencies:
  - esbuild

# Evita el chequeo previo de dependencias al correr scripts (pnpm 10/11),
# que en algunos entornos convierte el warning de build-scripts en error.
verifyDepsBeforeRun: false
