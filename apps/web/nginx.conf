# nginx (no-root, escucha en 8080) del frontend: sirve el SPA y hace de reverse
# proxy hacia el backend por la red interna de Docker.
server {
    listen 8080;
    listen [::]:8080;                        # IPv6 (evita el aviso del script de nginx no-root)
    server_name _;
    server_tokens off;                       # no filtrar la versión de nginx

    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad básicos (se heredan en todas las locations de abajo,
    # porque ninguna define su propio add_header).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets hasheados por Vite (index-<hash>.js/css, fuentes): cache larga.
    # El nombre cambia si cambia el contenido, así que es seguro cachear 1 año.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (necesario para react-router: /login, /cart, /orders/:id, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: todo lo que empiece con /api va al backend por la red interna.
    # El navegador nunca resuelve "backend" (corre en el host); sólo habla con
    # nginx en mismo origen, y nginx reenvía por la red de Docker.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Passthrough de los healthchecks del backend.
    location = /health { proxy_pass http://backend:3000/health; }
    location = /ready  { proxy_pass http://backend:3000/ready; }
}
