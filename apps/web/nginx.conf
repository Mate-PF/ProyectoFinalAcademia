# nginx del frontend: sirve el SPA y hace de reverse proxy hacia el backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip básico para los assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (necesario para react-router: /login, /cart, /orders/:id, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: todo lo que empiece con /api va al backend por la red interna.
    # El navegador nunca resuelve "backend" (no puede: corre en el host); sólo
    # habla con nginx en mismo origen, y nginx reenvía por la red de Docker.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Passthrough opcional del healthcheck del backend.
    location = /health {
        proxy_pass http://backend:3000/health;
    }
}
